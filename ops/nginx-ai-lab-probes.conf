# Include once in nginx's http context (before the AI Lab server block).
# $uri is nginx's normalized path; preserve ACME's .well-known directory.
map $uri $ailab_probe {
    default 0;
    ~*(^|/)\.(?!well-known(?:/|$)) 1;
    ~*^/(?:etc/(?:passwd|shadow)|proc/(?:self|[0-9]+)|cgi-bin|vendor/phpunit)(?:/|$) 1;
    ~*\.(?:php[0-9]?|phtml|asp|aspx|sql|bak)(?:/|$) 1;
    ~*^/(?:wp-admin|wp-includes|wp-content|wordpress|xmlrpc\.php)(?:/|$) 1;
}
