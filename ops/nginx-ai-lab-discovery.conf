# Include inside the ai-lab.gokcol.online HTTPS server block only.
# Exact static routes avoid Streamlit's HTML fallback and require no app session.
location = /robots.txt {
    root /opt/ai-lab/current/public;
    types { }
    default_type text/plain;
    expires 1h;
}

location = /sitemap.xml {
    root /opt/ai-lab/current/public;
    types { }
    default_type application/xml;
    expires 1h;
}

# Ownership verification persists independently of application releases.
location = /googled02c8d2341227caf.html {
    alias /opt/ai-lab/site-verification/googled02c8d2341227caf.html;
    types { }
    default_type text/html;
}
