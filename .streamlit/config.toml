# The lab's GUI is designed for light mode (cream panels, light inline-SVG diagrams,
# light gradients in gui/ui.py). Without this, Streamlit's "auto" theme follows the
# visitor's system setting and renders dark widgets (e.g. the Module selector) on the
# forced-light background — a mismatch. Pin light so every visitor sees the intended look.
[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eef2f7"
textColor = "#172033"

# The lab is presented as its own site, not as a demo of the toolkit behind it.
# "minimal" drops the developer entries from the app menu (Rerun, Clear cache,
# Record a screencast, Developer options) and the links out to streamlit.io that
# come with them. gui/ui.py then hides the remaining chrome outright; this setting
# means the menu is empty even before the CSS applies.
[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false
